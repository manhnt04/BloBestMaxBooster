name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR" || { echo "Xcode not found at $DEVELOPER_DIR"; ls -la /Applications | grep Xcode || true; exit 1; }
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Patch Expo and Swift Packages
        run: python3 scripts/fix-swift-packages.py

      - name: Run Expo Prebuild for iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Post-Prebuild Patch Native Headers & Packages
        run: python3 scripts/fix-swift-packages.py

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build iOS App (.app)
        working-directory: ios
        run: |
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          APP_NAME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Targeting App Scheme: $APP_NAME in Workspace: $WORKSPACE"
          
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -y GameBoosterUltra.ipa Payload
          ls -lh GameBoosterUltra.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBoosterUltra-IPA
          path: GameBoosterUltra.ipa
          retention-days: 14
