name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.2.app/Contents/Developer
          export DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Ensure iOS platform is installed
        run: |
          sudo xcodebuild -downloadPlatform iOS || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Patch all Package.swift for Swift 6.0 compatibility
        run: python3 scripts/fix-swift-packages.py

      - name: Run Expo Prebuild for iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Post-Prebuild Patch any generated Package.swift
        run: python3 scripts/fix-swift-packages.py

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Pre-build ExpoModulesJSI slice
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer
          cd node_modules/expo-modules-jsi/apple
          PODS_ROOT="$GITHUB_WORKSPACE/ios/Pods" \
          RN_ROOT="$GITHUB_WORKSPACE/node_modules/react-native" \
          PLATFORM_NAME=iphoneos \
          ./scripts/build-xcframework.sh

      - name: Build iOS App (.app)
        run: |
          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          APP_NAME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Targeting App Scheme: $APP_NAME in Workspace: $WORKSPACE"
          
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -y GameBoosterUltra.ipa Payload
          ls -lh GameBoosterUltra.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBoosterUltra-IPA
          path: GameBoosterUltra.ipa
          retention-days: 14
